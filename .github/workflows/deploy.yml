name: Docker Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        run: |
          docker build \
            -f ToDoList/src/ToDoList.Api/Dockerfile \
            -t bunyodmusayev/todolist-api:latest \
            ToDoList
          docker push bunyodmusayev/todolist-api:latest

      - name: Build & push Blazor image
        run: |
          docker build \
            -f ToDoList/src/ToDoList.BlazorUI/Dockerfile \
            -t bunyodmusayev/todolist-blazor:latest \
            ToDoList
          docker push bunyodmusayev/todolist-blazor:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/todolist
            docker compose pull
            docker compose up -d
            docker image prune -f